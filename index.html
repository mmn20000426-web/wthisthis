<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鴨蛋與牡蠣塔防戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121214;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 15px;
            color: #f1c40f;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #game-container {
            display: flex;
            gap: 20px;
            background: #1e1e24;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        canvas {
            background-color: #27ae60;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            display: block;
        }
        #ui-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stat-box {
            background: #2b2b36;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 4px solid #f1c40f;
        }
        .stat-box h3 {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 2px;
        }
        .stat-box p {
            font-size: 20px;
            font-weight: bold;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-sell {
            background: #e74c3c;
        }
        .btn-sell:hover:not(:disabled) {
            background: #c0392b;
        }
        .select-tower-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .select-btn {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            background: #444;
            color: white;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
        }
        .select-btn.active {
            border-color: #f1c40f;
            background: #2c3e50;
        }
        .tower-info {
            background: #2b2b36;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            min-height: 95px;
            border: 1px solid #3a3a4c;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>

    <h1>鴨蛋與牡蠣塔防戰</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div id="ui-panel">
            <div class="stat-box">
                <h3>玩家金幣</h3>
                <p id="gold-val">💰 150</p>
            </div>
            <div class="stat-box">
                <h3>基地生命</h3>
                <p id="hp-val">❤️ 10</p>
            </div>
            <div class="stat-box">
                <h3>目前波次</h3>
                <p id="wave-val">🌊 波次 1</p>
            </div>

            <label style="font-size:12px; color:#aaa;">選擇建造類型：</label>
            <div class="select-tower-group">
                <button class="select-btn" id="type-远程" onclick="setBuildType('远程')">🎯 遠程緩速塔 (💰100)</button>
                <button class="select-btn" id="type-近战" onclick="setBuildType('近战')">🎾 網球近戰塔 (💰120)</button>
                <button class="select-btn" id="type-手枪" onclick="setBuildType('手枪')">🔫 手槍格洛克塔 (💰150)</button>
                <button class="select-btn" id="type-複製" onclick="setBuildType('複製')">👥 複製體衝擊塔 (💰180)</button>
            </div>

            <div class="tower-info" id="tower-info">
                👉 <strong>點擊上方按鈕選擇建造類型，或點擊地圖上的塔進行選取</strong>
            </div>

            <div class="action-buttons">
                <button class="btn" id="btn-upgrade" onclick="upgradeTowerAll()" disabled>一鍵升級全屬性</button>
                <button class="btn btn-sell" id="btn-sell" onclick="sellSelectedTower()" disabled>💰 賣出防禦塔</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 載入圖片
        const bgImg = new Image();
        const enemyImg = new Image();
        const towerImg = new Image();
        const heavyEnemyImg = new Image();
        const meleeTowerImg = new Image();
        const fastEnemyImg = new Image();
        const glockTowerImg = new Image();
        const bossImg = new Image();
        const stunEnemyImg = new Image();
        const cloneTowerImg = new Image();
        const carImg = new Image();
        const imagesGunnerImg = new Image();

        bgImg.src = 'base.jpg';                 // 背景圖
        enemyImg.src = 'images (7).jpg';       // 普通敵人
        towerImg.src = 'images (6).jpg';       // 遠程緩速塔
        heavyEnemyImg.src = 'images (8).jpg';  // 重型敵人
        meleeTowerImg.src = 'images (9).jpg';  // 網球近戰塔
        fastEnemyImg.src = 'images (10).jpg';  // 快速敵人
        glockTowerImg.src = 'images (11).jpg'; // 手槍格洛克塔
        bossImg.src = 'images (12).jpg';       // BOSS 敵人
        stunEnemyImg.src = 'images (13).jpg';   // 擊暈敵人
        cloneTowerImg.src = 'images (14).jpg';  // 複製體衝擊塔
        carImg.src = 'car.jpg';                // 汽車型態圖片
        imagesGunnerImg.src = 'images.jpg';    // images 手槍槍手型態圖片

        let bossAudio = null;

        function playAttackSound(soundType = 'normal') {
            let soundFile = 'attack.mp3';
            let volume = 0.4;

            if (soundType === 'slow_tower') {
                soundFile = 'attack.mp3';
                volume = 0.6;
            } else if (soundType === 'melee') {
                soundFile = 'attack (1).mp3';
            } else if (soundType === 'gun') {
                soundFile = 'attack (2).mp4';
            } else if (soundType === 'clone_spawn') {
                soundFile = 'attack (3).mp4';
                volume = 0.5;
            }

            const attackSound = new Audio(soundFile);
            attackSound.volume = volume;
            attackSound.play().catch(() => {});
        }

        function playSkillSound() {
            const skillSound = new Audio('skill.mp4');
            skillSound.volume = 0.7;
            skillSound.play().catch(() => {});
        }

        function playBossMusic() {
            if (!bossAudio) {
                bossAudio = new Audio('music.mp3');
                bossAudio.volume = 0.6;
                bossAudio.loop = true;
            }
            bossAudio.play().catch(() => {});
        }

        function stopBossMusic() {
            if (bossAudio) {
                bossAudio.pause();
                bossAudio.currentTime = 0;
            }
        }

        let gold = 150;
        let hp = 10;
        let wave = 1;
        let enemiesSpawned = 0;
        let maxEnemiesPerWave = 5;
        let spawnTimer = 0;
        let selectedTower = null;
        let currentBuildType = null;
        let bossSpawnedThisWave = false;

        const path = [
            {x: 0, y: 80},
            {x: 180, y: 80},
            {x: 180, y: 260},
            {x: 80, y: 260},
            {x: 80, y: 420},
            {x: 420, y: 420},
            {x: 420, y: 150},
            {x: 650, y: 150},
            {x: 650, y: 350},
            {x: 800, y: 350},
            {x: 800, y: 80},
            {x: 900, y: 80}
        ];

        let towers = [];
        let enemies = [];
        let projectiles = [];
        let bossSkillProjectiles = [];
        let visualEffects = [];
        let cloneRunners = [];

        function setBuildType(type) {
            if (currentBuildType === type) {
                currentBuildType = null;
            } else {
                currentBuildType = type;
                selectedTower = null;
            }

            document.getElementById('type-远程').classList.toggle('active', currentBuildType === '远程');
            document.getElementById('type-近战').classList.toggle('active', currentBuildType === '近战');
            document.getElementById('type-手枪').classList.toggle('active', currentBuildType === '手枪');
            document.getElementById('type-複製').classList.toggle('active', currentBuildType === '複製');
            updateUI();
        }

        function clearBuildType() {
            currentBuildType = null;
            document.getElementById('type-远程').classList.remove('active');
            document.getElementById('type-近战').classList.remove('active');
            document.getElementById('type-手枪').classList.remove('active');
            document.getElementById('type-複製').classList.remove('active');
        }

        function getFirstTarget(towerX, towerY, range) {
            let bestEnemy = null;
            let maxProgress = -1;

            for (let enemy of enemies) {
                if (enemy.hp <= 0) continue;
                let dist = Math.hypot(enemy.x - towerX, enemy.y - towerY);
                if (dist <= range) {
                    if (enemy.distanceTraveled > maxProgress) {
                        maxProgress = enemy.distanceTraveled;
                        bestEnemy = enemy;
                    }
                }
            }
            return bestEnemy;
        }

        function getTowerCost(type) {
            return type === '複製' ? 180 : (type === '手枪' ? 150 : (type === '近战' ? 120 : 100));
        }

        class Tower {
            constructor(x, y, towerType = '远程') {
                this.x = x;
                this.y = y;
                this.radius = 22;
                this.towerType = towerType;
                this.level = 1;
                this.stunTimer = 0;
                this.weakenTimer = 0;
                this.totalSpent = getTowerCost(towerType);
                this.spawnDelayTimer = 0; // 複製體召喚延遲計時器

                if (towerType === '近战') {
                    this.range = 75;
                    this.baseDamage = 10;
                    this.fireRate = 35;
                    this.bonusGold = 15;
                    this.img = meleeTowerImg;
                } else if (towerType === '手枪') {
                    this.range = 200;
                    this.baseDamage = 85;
                    this.fireRate = 300;
                    this.bonusGold = 0;
                    this.img = glockTowerImg;
                    this.projectileType = 'bullet';
                } else if (towerType === '複製') {
                    this.range = 220;
                    this.baseDamage = 50;
                    this.fireRate = 360;
                    this.bonusGold = 0;
                    this.img = cloneTowerImg;
                } else {
                    this.range = 130;
                    this.baseDamage = 12;
                    this.fireRate = 40;
                    this.bonusGold = 0;
                    this.img = towerImg;
                    this.projectileType = 'egg';
                }

                this.cooldown = 0;
                this.swingAnimation = 0;
            }

            get damage() {
                if (this.weakenTimer > 0) {
                    return Math.max(1, Math.floor(this.baseDamage * 0.5));
                }
                return this.baseDamage;
            }

            draw() {
                if (selectedTower === this) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(241, 196, 15, 0.15)';
                    ctx.fill();
                    ctx.strokeStyle = '#f1c40f';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 3, 0, Math.PI * 2);
                ctx.fillStyle = selectedTower === this ? '#f1c40f' : (this.towerType === '近战' ? '#e67e22' : (this.towerType === '手枪' ? '#95a5a6' : (this.towerType === '複製' ? '#8e44ad' : '#333')));
                ctx.fill();

                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.clip();
                if (this.img.complete && this.img.naturalWidth !== 0) {
                    ctx.drawImage(this.img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.fillStyle = '#3498db';
                    ctx.fill();
                }
                ctx.restore();

                if (this.weakenTimer > 0) {
                    ctx.fillStyle = '#e67e22';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚠️ 傷害降低50%', this.x, this.y - this.radius - (this.stunTimer > 0 ? 20 : 8));
                }

                if (this.stunTimer > 0) {
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🪢 被抓取暈眩中', this.x, this.y - this.radius - 8);
                }

                if (this.swingAnimation > 0 && this.stunTimer <= 0) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate((10 - this.swingAnimation) * 0.3);
                    ctx.strokeStyle = '#f39c12';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(15, -15, 14, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                    this.swingAnimation--;
                }
            }

            update() {
                if (this.weakenTimer > 0) this.weakenTimer--;

                if (this.stunTimer > 0) {
                    this.stunTimer--;
                    return;
                }

                // 處理複製體 1.2 秒預告倒數 (72 frames)
                if (this.spawnDelayTimer > 0) {
                    this.spawnDelayTimer--;
                    if (this.spawnDelayTimer === 0) {
                        cloneRunners.push(new CloneRunner(this.damage));
                    }
                }

                if (this.cooldown > 0) this.cooldown--;

                if (this.cooldown <= 0) {
                    let target = getFirstTarget(this.x, this.y, this.range);

                    if (target || this.towerType === '複製') {
                        if (this.towerType === '近战') {
                            if (target) {
                                target.takeDamage(this.damage);
                                this.swingAnimation = 10;
                                this.cooldown = Math.max(8, this.fireRate);
                                playAttackSound('melee');
                            }
                        } else if (this.towerType === '手枪') {
                            if (target) {
                                projectiles.push(new Projectile(this.x, this.y, target, this.damage, 'bullet', false));
                                this.cooldown = Math.max(60, this.fireRate);
                                playAttackSound('gun');
                            }
                        } else if (this.towerType === '複製') {
                            playAttackSound('clone_spawn'); // 1.2秒前先播放音效
                            this.spawnDelayTimer = 72;     // 72 frames ≈ 1.2 秒後召喚
                            this.cooldown = Math.max(120, this.fireRate);
                        } else {
                            if (target) {
                                this.projectileType = this.projectileType === 'egg' ? 'oyster' : 'egg';
                                projectiles.push(new Projectile(this.x, this.y, target, this.damage, this.projectileType, true));
                                this.cooldown = Math.max(8, this.fireRate);
                                playAttackSound('slow_tower');
                            }
                        }
                    }
                }
            }

            upgrade() {
                let cost = this.level * 50;
                this.totalSpent += cost;
                this.level++;
                if (this.towerType === '手枪') {
                    this.baseDamage += 25;
                    this.fireRate = Math.max(120, Math.floor(this.fireRate * 0.95));
                } else if (this.towerType === '近战') {
                    this.baseDamage += 1;
                    this.bonusGold += 5;
                    this.fireRate = Math.max(8, Math.floor(this.fireRate * 0.95));
                } else if (this.towerType === '複製') {
                    this.baseDamage += 15;
                    this.fireRate = Math.max(150, Math.floor(this.fireRate * 0.95));
                } else {
                    this.baseDamage += 2;
                    this.fireRate = Math.max(8, Math.floor(this.fireRate * 0.95));
                }
                this.range += 6;
            }
        }

        class CloneRunner {
            constructor(maxHp = 50) {
                this.pathIndex = path.length - 1;
                this.x = path[this.pathIndex].x;
                this.y = path[this.pathIndex].y;
                this.speed = 2.5;
                this.radius = 18;
                this.hp = maxHp;
                this.maxHp = maxHp;
                this.img = cloneTowerImg;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.clip();
                if (this.img.complete && this.img.naturalWidth !== 0) {
                    ctx.drawImage(this.img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.fillStyle = '#8e44ad';
                    ctx.fill();
                }
                ctx.restore();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#9b59b6';
                ctx.lineWidth = 3;
                ctx.stroke();

                let barWidth = this.radius * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 6, barWidth, 4);
                ctx.fillStyle = '#3498db';
                ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 6, (Math.max(0, this.hp) / this.maxHp) * barWidth, 4);
            }

            update() {
                let target = path[this.pathIndex - 1];
                if (!target) return true;

                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex--;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }

                for (let enemy of enemies) {
                    if (enemy.hp <= 0) continue;
                    let d = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                    if (d <= this.radius + enemy.radius) {
                        if (enemy.type === 'car' && enemy.phase === 1) {
                            this.hp = 0;
                            return true;
                        }

                        if (this.hp >= enemy.hp) {
                            this.hp -= enemy.hp;
                            enemy.takeDamage(enemy.hp);
                            if (this.hp <= 0) return true;
                        } else {
                            enemy.takeDamage(this.hp);
                            this.hp = 0;
                            return true;
                        }
                    }
                }

                return false;
            }
        }

        class Enemy {
            constructor(type = 'normal') {
                this.x = path[0].x;
                this.y = path[0].y;
                this.pathIndex = 0;
                this.distanceTraveled = 0;
                this.type = type;
                this.dead = false;

                let baseHp;
                if (wave < 5) {
                    baseHp = 20 + wave * 10;
                } else {
                    baseHp = 60 + (wave - 4) * 25;
                }

                let baseSpeed = 1.2 + wave * 0.1;

                if (type === 'boss') {
                    this.radius = 30;
                    this.baseSpeed = baseSpeed * 0.35;
                    this.maxHp = baseHp * 15;
                    this.reward = 100 + wave * 20;
                    this.img = bossImg;
                    this.color = '#c0392b';
                    this.skillTimer = 0;
                    this.shoutTimer = 0;
                    playBossMusic();
                } else if (type === 'car') {
                    this.radius = 26;
                    this.baseSpeed = baseSpeed * 1.2;
                    this.phase = 1;
                    this.carHp = baseHp * 2.5;
                    this.humanHp = Math.max(10, baseHp * 0.6);
                    this.maxHp = this.carHp;
                    this.hp = this.carHp;
                    this.reward = 35 + wave * 5;
                    this.img = carImg;
                    this.color = '#111';
                    this.shootTimer = 0;
                } else if (type === 'heavy') {
                    this.radius = 24;
                    this.baseSpeed = baseSpeed * 0.5;
                    this.maxHp = baseHp * 2.2;
                    this.reward = Math.floor((12 + wave * 3) * 2);
                    this.img = heavyEnemyImg;
                    this.color = '#8e44ad';
                } else if (type === 'fast') {
                    this.radius = 16;
                    this.baseSpeed = baseSpeed * 2.5;
                    this.maxHp = baseHp * 0.4;
                    this.reward = Math.floor((12 + wave * 3) * 0.8);
                    this.img = fastEnemyImg;
                    this.color = '#f39c12';
                } else if (type === 'stun') {
                    this.radius = 22;
                    this.baseSpeed = baseSpeed * 0.85;
                    this.maxHp = baseHp * 1.6;
                    this.reward = Math.floor((12 + wave * 3) * 1.5);
                    this.img = stunEnemyImg;
                    this.color = '#16a085';
                    this.grabbingTarget = null;
                    this.grabTimer = 0;
                    this.grabCooldown = 0;
                } else {
                    this.radius = 20;
                    this.baseSpeed = baseSpeed;
                    this.maxHp = baseHp;
                    this.reward = 12 + wave * 3;
                    this.img = enemyImg;
                    this.color = '#e74c3c';
                }

                if (type !== 'car') {
                    this.hp = this.maxHp;
                }

                this.slowTimer = 0;
                this.boostTimer = 0;
            }

            takeDamage(amount) {
                if (this.dead) return;

                if (this.type === 'car' && this.phase === 1) {
                    this.hp -= amount;
                    if (this.hp <= 0) {
                        this.phase = 2;
                        this.img = imagesGunnerImg;
                        this.maxHp = this.humanHp;
                        this.hp = this.humanHp;
                        this.baseSpeed *= 0.6;
                        this.radius = 20;
                    }
                } else {
                    this.hp -= amount;
                    if (this.hp <= 0) {
                        this.hp = 0;
                        this.dead = true;
                        gold += this.reward;
                    }
                }
            }

            applySlow(durationFrames = 90) {
                if (this.boostTimer > 0) return;
                this.slowTimer = durationFrames;
            }

            applyBoost(durationFrames = 180) {
                this.boostTimer = durationFrames;
                this.slowTimer = 0;
            }

            draw() {
                if (this.dead) return;

                ctx.save();

                if (this.slowTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = '#3498db';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                if (this.boostTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = '#e74c3c';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                if (this.type === 'stun' && this.grabbingTarget) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.grabbingTarget.x, this.grabbingTarget.y);
                    ctx.strokeStyle = '#e74c3c';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.clip();

                let activeImg = (this.type === 'car' && this.phase === 2) ? imagesGunnerImg : this.img;

                if (activeImg.complete && activeImg.naturalWidth !== 0) {
                    ctx.drawImage(activeImg, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                ctx.restore();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.type === 'boss' ? '#f1c40f' : (this.type === 'car' ? (this.phase === 1 ? '#000' : '#e67e22') : this.color);
                ctx.lineWidth = this.type === 'boss' ? 4 : (this.type === 'heavy' || this.type === 'car' ? 3 : 2);
                ctx.stroke();

                if (this.type === 'car') {
                    ctx.fillStyle = this.phase === 1 ? '#f1c40f' : '#e67e22';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.phase === 1 ? '汽車型態 (car.jpg)' : 'images 槍手掃射', this.x, this.y - this.radius - 14);
                } else if (this.boostTimer > 0) {
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('SPEED UP', this.x, this.y - this.radius - 14);
                } else if (this.slowTimer > 0) {
                    ctx.fillStyle = '#3498db';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('SLOW', this.x, this.y - this.radius - 14);
                }

                let barWidth = this.radius * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 8, barWidth, 5);
                ctx.fillStyle = this.type === 'boss' ? '#e74c3c' : (this.type === 'car' && this.phase === 1 ? '#f39c12' : '#2ecc71');
                ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 8, (Math.max(0, this.hp) / this.maxHp) * barWidth, 5);
            }

            update() {
                if (this.dead) return;

                let currentSpeed = this.baseSpeed;
                
                if (this.boostTimer > 0) {
                    currentSpeed *= 1.3;
                    this.boostTimer--;
                } else if (this.slowTimer > 0) {
                    currentSpeed *= 0.6;
                    this.slowTimer--;
                }

                if (this.type === 'car' && this.phase === 2) {
                    this.shootTimer++;
                    if (this.shootTimer >= 100) {
                        this.shootTimer = 0;
                        playAttackSound('gun');
                        visualEffects.push(new WaveEffect(this.x, this.y, 170));

                        if (towers.length > 0) {
                            let shuffled = [...towers].sort(() => 0.5 - Math.random());
                            let targets = shuffled.slice(0, 2);
                            for (let targetTower of targets) {
                                targetTower.weakenTimer = 240;
                            }
                        }
                    }
                }

                if (this.type === 'boss') {
                    this.skillTimer++;
                    if (this.skillTimer >= 600) {
                        this.skillTimer = 0;
                        if (towers.length > 0) {
                            let targetTower = towers[Math.floor(Math.random() * towers.length)];
                            bossSkillProjectiles.push(new BossSkillBall(this.x, this.y, targetTower));
                        }
                    }

                    this.shoutTimer++;
                    if (this.shoutTimer >= 420) {
                        this.shoutTimer = 0;
                        playSkillSound();
                        visualEffects.push(new WaveEffect(this.x, this.y, 180));

                        for (let enemy of enemies) {
                            if (enemy !== this && !enemy.dead) {
                                let dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                                if (dist <= 180) {
                                    enemy.applyBoost(180);
                                }
                            }
                        }
                    }
                }

                if (this.type === 'stun') {
                    if (this.grabCooldown > 0) {
                        this.grabCooldown--;
                    }

                    if (this.grabbingTarget) {
                        this.grabTimer--;
                        this.grabbingTarget.stunTimer = 2;
                        if (this.grabTimer <= 0) {
                            this.grabbingTarget.stunTimer = 240;
                            this.grabbingTarget = null;
                            this.grabCooldown = 360;
                        }
                        return;
                    } else if (this.grabCooldown <= 0) {
                        for (let tower of towers) {
                            if (tower.stunTimer <= 0) {
                                let dist = Math.hypot(tower.x - this.x, tower.y - this.y);
                                if (dist <= 80) {
                                    this.grabbingTarget = tower;
                                    this.grabTimer = 120;
                                    playAttackSound('normal');
                                    break;
                                }
                            }
                        }
                    }
                }

                let target = path[this.pathIndex + 1];
                if (!target) return;

                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < currentSpeed) {
                    this.distanceTraveled += dist;
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex++;
                    if (this.pathIndex >= path.length - 1) {
                        hp -= this.type === 'boss' ? 5 : (this.type === 'heavy' || this.type === 'car' ? 2 : 1);
                        this.hp = 0;
                        this.dead = true;
                        if (this.type === 'boss') stopBossMusic();
                    }
                } else {
                    this.x += (dx / dist) * currentSpeed;
                    this.y += (dy / dist) * currentSpeed;
                    this.distanceTraveled += currentSpeed;
                }
            }
        }

        class WaveEffect {
            constructor(x, y, maxRadius) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = maxRadius;
                this.alpha = 1.0;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(231, 76, 60, ${this.alpha})`;
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
            }

            update() {
                this.radius += 5;
                this.alpha = 1 - (this.radius / this.maxRadius);
                return this.radius >= this.maxRadius;
            }
        }

        class BossSkillBall {
            constructor(x, y, targetTower) {
                this.x = x;
                this.y = y;
                this.targetTower = targetTower;
                this.speed = 6;
                this.radius = 11;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#795548';
                ctx.fill();
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            update() {
                let dx = this.targetTower.x - this.x;
                let dy = this.targetTower.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    return true;
                }

                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                return false;
            }
        }

        class Projectile {
            constructor(x, y, target, damage, type, isSlow = false) {
                this.x = x;
                this.y = y;
                this.target = target;
                this.damage = damage;
                this.type = type;
                this.isSlow = isSlow;
                this.speed = type === 'bullet' ? 16 : 9;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.type === 'bullet') {
                    ctx.beginPath();
                    ctx.arc(0, 0, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#f39c12';
                    ctx.fill();
                    ctx.strokeStyle = '#e67e22';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (this.type === 'egg') {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 7, 10, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#fffdd0';
                    ctx.fill();
                    ctx.strokeStyle = '#d4ac0d';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0.2, Math.PI * 1.5);
                    ctx.closePath();
                    ctx.fillStyle = '#95a5a6';
                    ctx.fill();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
                ctx.restore();
            }

            update() {
                if (!this.target || this.target.dead) return true;

                let dx = this.target.x - this.x;
                let dy = this.target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.target.takeDamage(this.damage);

                    if (this.isSlow && this.target.applySlow) {
                        this.target.applySlow(90);
                    }
                    return true;
                }

                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                return false;
            }
        }

        function drawBackgroundAndPath() {
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.strokeStyle = 'rgba(44, 62, 80, 0.6)';
            ctx.lineWidth = 36;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
        }

        function isPointNearSegment(px, py, p1, p2, threshold) {
            let l2 = (p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2;
            if (l2 === 0) return Math.hypot(px - p1.x, py - p1.y) < threshold;
            let t = Math.max(0, Math.min(1, ((px - p1.x) * (p2.x - p1.x) + (py - p1.y) * (p2.y - p1.y)) / l2));
            let projX = p1.x + t * (p2.x - p1.x);
            let projY = p1.y + t * (p2.y - p1.y);
            return Math.hypot(px - projX, py - projY) < threshold;
        }

        function canBuild(x, y) {
            for (let i = 0; i < path.length - 1; i++) {
                if (isPointNearSegment(x, y, path[i], path[i+1], 32)) return false;
            }
            for (let tower of towers) {
                if (Math.hypot(tower.x - x, tower.y - y) < 45) return false;
            }
            return true;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackgroundAndPath();

            let spawnInterval = 36;
            
            if (wave === 1) {
                maxEnemiesPerWave = 5;
            } else if (wave < 5) {
                maxEnemiesPerWave = 4 + wave * 4;
            } else {
                maxEnemiesPerWave = 8 + wave * 4;
                spawnInterval = 24;
            }

            spawnTimer++;

            if (wave % 5 === 0 && !bossSpawnedThisWave) {
                enemies.push(new Enemy('boss'));
                bossSpawnedThisWave = true;
            }

            if (spawnTimer >= spawnInterval && enemiesSpawned < maxEnemiesPerWave) {
                let enemyType = 'normal';
                if (wave >= 2) {
                    let rand = Math.random();

                    if (wave >= 7 && rand < 0.05) {
                        enemyType = 'car';
                    } else if (wave >= 5 && rand < 0.10) {
                        enemyType = 'stun';
                    } else if (rand < 0.25) {
                        enemyType = 'heavy';
                    } else if (rand < 0.65) {
                        enemyType = 'fast';
                    } else {
                        enemyType = 'normal';
                    }
                }

                enemies.push(new Enemy(enemyType));
                enemiesSpawned++;
                spawnTimer = 0;
            }

            if (enemies.length === 0 && enemiesSpawned >= maxEnemiesPerWave) {
                wave++;
                enemiesSpawned = 0;
                bossSpawnedThisWave = false;

                let bonusTotal = 0;
                for (let tower of towers) {
                    if (tower.towerType === '近战') {
                        bonusTotal += tower.bonusGold;
                    }
                }
                if (bonusTotal > 0) {
                    gold += bonusTotal;
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.update();
                e.draw();
                if (e.dead) {
                    if (e.type === 'boss') {
                        stopBossMusic();
                    }
                    enemies.splice(i, 1);
                }
            }

            for (let tower of towers) {
                tower.update();
                tower.draw();
            }

            for (let i = cloneRunners.length - 1; i >= 0; i--) {
                let cr = cloneRunners[i];
                cr.draw();
                if (cr.update()) {
                    cloneRunners.splice(i, 1);
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.draw();
                if (p.update()) {
                    projectiles.splice(i, 1);
                }
            }

            for (let i = bossSkillProjectiles.length - 1; i >= 0; i--) {
                let bp = bossSkillProjectiles[i];
                bp.draw();
                if (bp.update()) {
                    bossSkillProjectiles.splice(i, 1);
                }
            }

            for (let i = visualEffects.length - 1; i >= 0; i--) {
                let effect = visualEffects[i];
                effect.draw();
                if (effect.update()) {
                    visualEffects.splice(i, 1);
                }
            }

            updateUI();

            if (hp <= 0) {
                stopBossMusic();
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 42px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('gold-val').innerText = `💰 ${gold}`;
            document.getElementById('hp-val').innerText = `❤️ ${hp}`;
            document.getElementById('wave-val').innerText = `🌊 波次 ${wave}`;

            const info = document.getElementById('tower-info');
            const btnUpgrade = document.getElementById('btn-upgrade');
            const btnSell = document.getElementById('btn-sell');

            if (selectedTower) {
                let cost = selectedTower.level * 50;
                let sellPrice = Math.floor(selectedTower.totalSpent * 0.7);

                info.innerHTML = `
                    🎯 <strong>已選取：${selectedTower.towerType}塔 (Lv.${selectedTower.level})</strong><br>
                    • 傷害/衝擊血量: ${selectedTower.damage}${selectedTower.weakenTimer > 0 ? ' (⚠️受虛弱影響)' : ''}<br>
                    • 攻擊頻率: ${(60 / selectedTower.fireRate).toFixed(2)}/秒<br>
                    • 範圍: ${selectedTower.range}<br>
                    ${selectedTower.towerType === '远程' ? '• 特效: 擊中附帶 40% 緩速 (1.5秒)' : ''}
                    ${selectedTower.towerType === '近战' ? `• 每回合收益: 💰${selectedTower.bonusGold}` : ''}
                    ${selectedTower.towerType === '手枪' ? '• 特色: 超高傷害 (5秒發射一次)' : ''}
                    ${selectedTower.towerType === '複製' ? '• 特色: 從邊界召喚慢速衝擊體撞擊敵人' : ''}
                `;

                btnUpgrade.disabled = gold < cost;
                btnUpgrade.innerText = `一鍵升級全屬性 [💰 ${cost}]`;
                
                btnSell.disabled = false;
                btnSell.innerText = `💰 賣出防禦塔 (+💰${sellPrice})`;
            } else if (currentBuildType) {
                let cost = getTowerCost(currentBuildType);
                info.innerHTML = `👉 <strong>點擊草地建造${currentBuildType}塔</strong><br>建塔花費: 💰 ${cost}<br>（再次點擊按鈕可切換回空手狀態）`;
                btnUpgrade.disabled = true;
                btnUpgrade.innerText = `一鍵升級全屬性`;
                btnSell.disabled = true;
                btnSell.innerText = `💰 賣出防禦塔`;
            } else {
                info.innerHTML = `👉 <strong>空手狀態</strong><br>點擊上方建造按鈕準備建塔，或點擊地圖上的塔進行升級/賣出。`;
                btnUpgrade.disabled = true;
                btnUpgrade.innerText = `一鍵升級全屬性`;
                btnSell.disabled = true;
                btnSell.innerText = `💰 賣出防禦塔`;
            }
        }

        function upgradeTowerAll() {
            if (!selectedTower) return;
            let cost = selectedTower.level * 50;
            if (gold >= cost) {
                gold -= cost;
                selectedTower.upgrade();
                updateUI();
            }
        }

        function sellSelectedTower() {
            if (!selectedTower) return;
            let sellPrice = Math.floor(selectedTower.totalSpent * 0.7);
            gold += sellPrice;
            
            towers = towers.filter(t => t !== selectedTower);
            selectedTower = null;
            updateUI();
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            let clickedTower = null;
            for (let tower of towers) {
                if (Math.hypot(tower.x - x, tower.y - y) <= tower.radius + 5) {
                    clickedTower = tower;
                    break;
                }
            }

            if (clickedTower) {
                selectedTower = clickedTower;
                clearBuildType();
            } else if (currentBuildType) {
                let cost = getTowerCost(currentBuildType);
                if (gold >= cost && canBuild(x, y)) {
                    gold -= cost;
                    let newTower = new Tower(x, y, currentBuildType);
                    towers.push(newTower);
                    selectedTower = newTower;
                    clearBuildType();
                } else {
                    selectedTower = null;
                }
            } else {
                selectedTower = null;
            }
            updateUI();
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
